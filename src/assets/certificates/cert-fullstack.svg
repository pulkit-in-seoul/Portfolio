  <!-- Footer Info -->
  <line x1="100" y1="460" x2="280" y2="460" stroke="#475569" stroke-width="1.5" />
  <text x="190" y="485" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Verified Instructor</text>
  <text x="190" y="505" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Authorized Signature</text>

