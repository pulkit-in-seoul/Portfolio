  <line x1="250" y1="270" x2="550" y2="270" stroke="url(#tealGrad)" stroke-width="2" />

  <!-- Course description -->
  <text x="400" y="310" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">For successfully mastering advanced concepts in</text>
  <text x="400" y="345" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">Full Stack Web Development (MERN)</text>
