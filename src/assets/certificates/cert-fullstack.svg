  </defs>

  <!-- Background -->
  <rect width="800" height="560" rx="16" fill="url(#certBg)" stroke="url(#goldGrad)" stroke-width="4" />
  <rect x="20" y="20" width="760" height="520" rx="12" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Badge Seal -->
  <circle cx="400" cy="90" r="45" fill="url(#goldGrad)" opacity="0.15" />
  <circle cx="400" cy="90" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M400 70 L408 86 L426 88 L412 101 L416 118 L400 109 L384 118 L388 101 L374 88 L392 86 Z" fill="url(#goldGrad)" />

