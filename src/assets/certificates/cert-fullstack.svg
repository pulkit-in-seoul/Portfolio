  <text x="400" y="458" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">VERIFIED</text>
  <text x="400" y="478" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">ID: GSR-8942-FS</text>

  <line x1="520" y1="460" x2="700" y2="460" stroke="#475569" stroke-width="1.5" />
  <text x="610" y="485" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Issued Date</text>
